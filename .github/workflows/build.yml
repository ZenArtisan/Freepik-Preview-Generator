name: Build & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: PreviewGen-Windows
            ext: exe
          - os: macos-latest
            artifact: PreviewGen-macOS
            ext: dmg
          - os: ubuntu-22.04
            artifact: PreviewGen-Linux
            ext: AppImage

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pytest

      # ── Linux: install system webview deps ──
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-0 libgl1-mesa-glx libegl1 fuse libfuse2 xvfb

      # ── Build React Frontend with npm ci and TypeScript Typecheck ──
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build React frontend
        run: |
          cd frontend
          npm ci
          npm run typecheck
          npm run build
          cd ..

      # ── Mandatory Python Test Suite Gate (includes frontend bundle check) ──
      - name: Run Python unit and integration test suite
        run: |
          python -m pytest tests/ -v

      # ── Build with PyInstaller (native windowed .app on macOS) ──
      - name: Build executable
        run: |
          pyinstaller --noconsole --name PreviewGen --icon=app.ico \
            --add-data "app.ico${{ runner.os == 'Windows' && ';' || ':' }}." \
            --add-data "frontend/dist${{ runner.os == 'Windows' && ';' || ':' }}frontend/dist" \
            --collect-all psd_tools --collect-all trimesh --collect-all webview \
            --collect-all ezdxf --collect-all olefile --collect-all cascadio \
            --collect-all resvg_py --collect-all matplotlib \
            ${{ runner.os == 'macOS' && '--osx-bundle-identifier com.zenartisan.previewgen --windowed' || '' }} \
            app.py --clean -y
      # ── Windows: Startup test, Code Signing, Inno Setup wizard & ZIP ──
      - name: Windows Startup Test
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Write-Host "Running Windows startup smoke test..."
          $output = & "dist\PreviewGen\PreviewGen.exe" --smoke-test
          Write-Host $output
          if ($LASTEXITCODE -ne 0) {
            throw "Windows startup test failed with exit code $LASTEXITCODE"
          }

      - name: Sign Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if ("${{ secrets.WINDOWS_CERTIFICATE }}" -ne "") {
            Write-Host "Signing Windows binary with certificate..."
            $certBytes = [Convert]::FromBase64String("${{ secrets.WINDOWS_CERTIFICATE }}")
            [IO.File]::WriteAllBytes("cert.pfx", $certBytes)
            & "C:\Program Files (x86)\Windows Kits\10\bin\10.0.22621.0\x64\signtool.exe" sign /f cert.pfx /p "${{ secrets.WINDOWS_CERTIFICATE_PWD }}" /tr http://timestamp.digicert.com /td sha256 /fd sha256 dist\PreviewGen\PreviewGen.exe
            Remove-Item cert.pfx -Force
          } else {
            Write-Host "Notice: No WINDOWS_CERTIFICATE secret configured. Skipping Windows binary signing."
          }

      - name: Package Windows build
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item install_desktop_icon.bat dist\PreviewGen\Install-Desktop-Icon.bat
          Copy-Item app.ico dist\PreviewGen\app.ico
          Compress-Archive -Path dist\PreviewGen\* -DestinationPath PreviewGen-Windows.zip -Force
          # Compile Inno Setup installer wizard (PreviewGen-Setup.exe)
          & "C:\Program Files (x86)\Inno Setup 6\iscc.exe" installer.iss
          Move-Item dist\PreviewGen-Setup.exe .

      - name: Sign Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if ("${{ secrets.WINDOWS_CERTIFICATE }}" -ne "" -and (Test-Path "PreviewGen-Setup.exe")) {
            Write-Host "Signing Windows setup installer..."
            $certBytes = [Convert]::FromBase64String("${{ secrets.WINDOWS_CERTIFICATE }}")
            [IO.File]::WriteAllBytes("cert.pfx", $certBytes)
            & "C:\Program Files (x86)\Windows Kits\10\bin\10.0.22621.0\x64\signtool.exe" sign /f cert.pfx /p "${{ secrets.WINDOWS_CERTIFICATE_PWD }}" /tr http://timestamp.digicert.com /td sha256 /fd sha256 PreviewGen-Setup.exe
            Remove-Item cert.pfx -Force
          }

      # ── macOS: Genuine .app bundle, Code Signing, Startup test & DMG ──
      - name: Package macOS build
        if: runner.os == 'macOS'
        run: |
          test -d "dist/PreviewGen.app" || { echo "FATAL: PyInstaller did not generate dist/PreviewGen.app"; exit 1; }
          test -f "dist/PreviewGen.app/Contents/MacOS/PreviewGen" || { echo "FATAL: Missing executable inside dist/PreviewGen.app"; exit 1; }
          mkdir -p dmg_staging
          cp -R dist/PreviewGen.app dmg_staging/

      - name: Sign macOS Application
        if: runner.os == 'macOS'
        run: |
          APP_PATH="dmg_staging/PreviewGen.app"
          if [ -n "${{ secrets.MACOS_CERTIFICATE }}" ]; then
            echo "Importing Apple Developer Certificate..."
            echo "${{ secrets.MACOS_CERTIFICATE }}" | base64 --decode > certificate.p12
            KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
            security create-keychain -p "" $KEYCHAIN_PATH
            security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
            security unlock-keychain -p "" $KEYCHAIN_PATH
            security import certificate.p12 -k $KEYCHAIN_PATH -P "${{ secrets.MACOS_CERTIFICATE_PWD }}" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" $KEYCHAIN_PATH
            codesign --deep --force --options runtime --timestamp --sign "${{ secrets.MACOS_DEVELOPER_IDENTITY }}" "$APP_PATH"
            rm -f certificate.p12
          else
            echo "Notice: No MACOS_CERTIFICATE configured. Applying ad-hoc signature for Apple Silicon/Gatekeeper compatibility..."
            codesign --force --deep --sign - "$APP_PATH"
          fi

      - name: macOS Startup Test
        if: runner.os == 'macOS'
        run: |
          echo "Running macOS startup smoke test..."
          ./dmg_staging/PreviewGen.app/Contents/MacOS/PreviewGen --smoke-test

      - name: Create macOS DMG
        if: runner.os == 'macOS'
        run: |
          ln -s /Applications dmg_staging/Applications
          hdiutil create -volname "PreviewGen" -srcfolder dmg_staging -ov -format UDZO PreviewGen-macOS.dmg

      # ── Linux: Startup test & Genuine AppImage ──
      - name: Linux Startup Test
        if: runner.os == 'Linux'
        run: |
          echo "Running Linux executable smoke test..."
          xvfb-run -a ./dist/PreviewGen/PreviewGen --smoke-test

      - name: Package Linux AppImage
        if: runner.os == 'Linux'
        run: |
          mkdir -p PreviewGen.AppDir/usr/bin
          mkdir -p PreviewGen.AppDir/usr/share/applications
          mkdir -p PreviewGen.AppDir/usr/share/icons/hicolor/256x256/apps
          cp -R dist/PreviewGen/* PreviewGen.AppDir/usr/bin/
          python -c "from PIL import Image; Image.open('app.ico').save('PreviewGen.AppDir/previewgen.png')"
          cp PreviewGen.AppDir/previewgen.png PreviewGen.AppDir/.DirIcon
          cp PreviewGen.AppDir/previewgen.png PreviewGen.AppDir/usr/share/icons/hicolor/256x256/apps/previewgen.png

          cat > PreviewGen.AppDir/previewgen.desktop << 'EOF'
          [Desktop Entry]
          Name=PreviewGen
          Exec=PreviewGen
          Icon=previewgen
          Type=Application
          Categories=Graphics;
          Comment=Transparent PNG to JPG Preview Generator
          EOF
          cp PreviewGen.AppDir/previewgen.desktop PreviewGen.AppDir/usr/share/applications/previewgen.desktop

          cat > PreviewGen.AppDir/AppRun << 'APPRUN'
          #!/bin/bash
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/PreviewGen" "$@"
          APPRUN
          chmod +x PreviewGen.AppDir/AppRun
          wget -q "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage" -O appimagetool
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool PreviewGen.AppDir PreviewGen-Linux.AppImage
          test -f PreviewGen-Linux.AppImage || { echo "FATAL: appimagetool failed to create PreviewGen-Linux.AppImage"; exit 1; }
          chmod +x PreviewGen-Linux.AppImage

      # ── Upload artifact ──
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            PreviewGen-Setup.exe
            PreviewGen-Windows.zip
            PreviewGen-macOS.dmg
            PreviewGen-Linux.AppImage

  # ── Isolated Clean Machine Tests (WITHOUT Python or Node.js) ──
  clean-machine-test:
    name: Clean Machine Test (${{ matrix.os }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: PreviewGen-Windows
          - os: macos-latest
            artifact: PreviewGen-macOS
          - os: ubuntu-22.04
            artifact: PreviewGen-Linux

    runs-on: ${{ matrix.os }}
    steps:
      # Crucial: NO actions/setup-python and NO actions/setup-node installed here!
      - name: Download compiled artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}

      - name: Test on clean Windows machine
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Write-Host "Unpacking Windows artifact on machine without project Python/Node..."
          Expand-Archive -Path PreviewGen-Windows.zip -DestinationPath test_clean_win
          $result = & "test_clean_win\PreviewGen.exe" --smoke-test
          Write-Host $result
          if ($LASTEXITCODE -ne 0) {
            throw "Clean machine Windows execution failed with code $LASTEXITCODE"
          }
          Write-Host "Windows clean machine test passed successfully!"

      - name: Test on clean macOS machine
        if: runner.os == 'macOS'
        run: |
          echo "Mounting macOS DMG on machine without project Python/Node..."
          hdiutil attach PreviewGen-macOS.dmg -mountpoint /Volumes/PreviewGenTest
          /Volumes/PreviewGenTest/PreviewGen.app/Contents/MacOS/PreviewGen --smoke-test
          hdiutil detach /Volumes/PreviewGenTest
          echo "macOS clean machine test passed successfully!"

      - name: Test on clean Linux machine
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          echo "Testing Linux AppImage on machine without project Python/Node..."
          sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-0 xvfb libfuse2
          chmod +x PreviewGen-Linux.AppImage
          # 1. Headless smoke test
          xvfb-run -a ./PreviewGen-Linux.AppImage --smoke-test
          # 2. Window startup verification (ensures window initializes and process stays alive)
          xvfb-run -a ./PreviewGen-Linux.AppImage > previewgen-linux.log 2>&1 &
          APP_PID=$!
          sleep 8
          if ! kill -0 "$APP_PID" 2>/dev/null; then
            echo "PreviewGen terminated unexpectedly during startup!"
            cat previewgen-linux.log
            exit 1
          fi
          kill "$APP_PID"
          wait "$APP_PID" 2>/dev/null || true
          echo "Linux clean machine test passed successfully!"

  # ── Release generation with SHA256 checksums ──
  release:
    needs: [build, clean-machine-test]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Generate SHA-256 Checksums
        run: |
          echo "Generating SHA-256 checksums for release verification..."
          sha256sum PreviewGen-* > SHA256SUMS.txt
          echo "Generated SHA256SUMS.txt:"
          cat SHA256SUMS.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            PreviewGen-Setup.exe
            PreviewGen-Windows.zip
            PreviewGen-macOS.dmg
            PreviewGen-Linux.AppImage
            SHA256SUMS.txt
