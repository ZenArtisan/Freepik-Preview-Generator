name: Build & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact: PreviewGen-Windows
            ext: exe
          - os: macos-latest
            artifact: PreviewGen-macOS
            ext: dmg
          - os: ubuntu-22.04
            artifact: PreviewGen-Linux
            ext: AppImage

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      # ── Linux: install system Qt deps ──
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon0 libxcb-xinerama0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 \
            libgl1-mesa-glx libegl1 libfontconfig1 \
            libdbus-1-3 libxcb-randr0 libxcb-render-util0 \
            fuse libfuse2

      # ── Build React Frontend ──
      - name: Build React frontend
        run: |
          cd frontend
          npm install
          npm run build
          cd ..

      # ── Build with PyInstaller ──
      - name: Build executable
        run: |
          pyinstaller --noconsole --name PreviewGen --add-data "app.ico${{ runner.os == 'Windows' && ';' || ':' }}." --add-data "frontend/dist${{ runner.os == 'Windows' && ';' || ':' }}frontend/dist" --collect-all psd_tools --collect-all trimesh --collect-all webview --collect-all ezdxf --collect-all olefile --collect-all cascadio --hidden-import PySide6.QtSvg app.py --clean -y
      # ── Windows: build Inno Setup wizard and zip portable dist ──
      - name: Package Windows build
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item install_desktop_icon.bat dist\PreviewGen\Install-Desktop-Icon.bat
          Copy-Item app.ico dist\PreviewGen\app.ico
          Compress-Archive -Path dist\PreviewGen\* -DestinationPath PreviewGen-Windows.zip -Force
          # Compile Inno Setup installer wizard (PreviewGen-Setup.exe)
          & "C:\Program Files (x86)\Inno Setup 6\iscc.exe" installer.iss
          Move-Item dist\PreviewGen-Setup.exe .
      # ── macOS: create .dmg ──
      - name: Package macOS build
        if: runner.os == 'macOS'
        run: |
          mkdir -p dmg_staging
          cp -R dist/PreviewGen dmg_staging/PreviewGen.app 2>/dev/null || cp -R dist/PreviewGen dmg_staging/
          hdiutil create -volname "PreviewGen" -srcfolder dmg_staging -ov -format UDZO PreviewGen-macOS.dmg

      # ── Linux: create AppImage ──
      - name: Package Linux AppImage
        if: runner.os == 'Linux'
        run: |
          # Create AppDir structure
          mkdir -p PreviewGen.AppDir/usr/bin
          mkdir -p PreviewGen.AppDir/usr/share/icons/hicolor/256x256/apps
          cp -R dist/PreviewGen/* PreviewGen.AppDir/usr/bin/
          cp app.ico PreviewGen.AppDir/usr/share/icons/hicolor/256x256/apps/previewgen.ico || true

          # Desktop entry
          cat > PreviewGen.AppDir/previewgen.desktop << 'EOF'
          [Desktop Entry]
          Name=PreviewGen
          Exec=PreviewGen
          Icon=previewgen
          Type=Application
          Categories=Graphics;
          Comment=Transparent PNG to JPG Preview Generator
          EOF
          cp PreviewGen.AppDir/previewgen.desktop PreviewGen.AppDir/usr/share/applications/previewgen.desktop 2>/dev/null || true

          # AppRun
          cat > PreviewGen.AppDir/AppRun << 'APPRUN'
          #!/bin/bash
          HERE="$(dirname "$(readlink -f "$0")")"
          export LD_LIBRARY_PATH="$HERE/usr/bin:$LD_LIBRARY_PATH"
          exec "$HERE/usr/bin/PreviewGen" "$@"
          APPRUN
          chmod +x PreviewGen.AppDir/AppRun

          # Download appimagetool
          wget -q "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage" -O appimagetool
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool PreviewGen.AppDir PreviewGen-Linux.AppImage || true

          # Fallback: tar if AppImage fails
          if [ ! -f PreviewGen-Linux.AppImage ]; then
            tar -czf PreviewGen-Linux.tar.gz -C dist PreviewGen
            mv PreviewGen-Linux.tar.gz PreviewGen-Linux.AppImage
          fi

      # ── Upload artifact ──
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            PreviewGen-Setup.exe
            PreviewGen-Windows.zip
            PreviewGen-macOS.dmg
            PreviewGen-Linux.AppImage

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            PreviewGen-Setup.exe
            PreviewGen-Windows.zip
            PreviewGen-macOS.dmg
            PreviewGen-Linux.AppImage
